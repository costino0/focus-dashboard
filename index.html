<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <p id="clock">00:00</p>
        <h1>Focus</h1>
        <p id="greeting">Welcome to Focus, a place where you can clear your mind.</p>

        <form id="name-form">
            <label for="name-input">What should we call you?</label>
            <input 
            id="name-input" 
            name="name" 
            autocomplete="given-name" 
            required
            >
            <button type="submit">Save name</button>
        </form>
        
        <section>
            <h2 id="today-focus">Today's focus</h2>

            <form id="focus-form">
                <label for="focus-input">What's your main priority today?</label>
                <input 
                id="focus-input" 
                name="focus"
                required
                >
                <button type="submit">Save focus</button>
            </form>

            <p id="focus-display">No focus set yet.</p>

            <label for="focus-completed">Mark focus as completed</label>
            <input id="focus-completed" type="checkbox">
        </section>
    </main>
    
    <script src="script.js"></script>
</body>
</html>
